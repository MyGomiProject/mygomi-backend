<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>마이고미 채팅 테스트 (JWT)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        body { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; padding: 20px; background-color: #f5f5f5; }
        .chat-container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }

        /* 입력 폼 스타일 */
        .input-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .row { display: flex; gap: 10px; }
        input[type="text"], input[type="number"] { padding: 10px; border: 1px solid #ddd; border-radius: 5px; outline: none; }
        input:focus { border-color: #ffd000; }

        button { cursor: pointer; padding: 10px 15px; background-color: #ffd000; border: none; border-radius: 5px; font-weight: bold; color: #333; transition: 0.2s; }
        button:hover { background-color: #ffaa00; }
        button:disabled { background-color: #ddd; cursor: not-allowed; }

        /* 채팅창 스타일 */
        #messages {
            border: 1px solid #eee;
            background-color: #fcfcfc;
            height: 400px;
            overflow-y: scroll;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 메시지 말풍선 공통 */
        .message-wrapper { max-width: 80%; display: flex; flex-direction: column; }
        .message-content { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; position: relative; }
        .message-info { font-size: 11px; color: #888; margin-top: 4px; }

        /* 내가 보낸 메시지 (오른쪽) */
        .my-msg-wrapper { align-self: flex-end; align-items: flex-end; }
        .my-msg-wrapper .message-content { background-color: #fee500; color: #333; border-top-right-radius: 2px; }
        .my-msg-wrapper .message-info { text-align: right; }

        /* 상대방 메시지 (왼쪽) */
        .other-msg-wrapper { align-self: flex-start; align-items: flex-start; }
        .other-msg-wrapper .message-content { background-color: #eee; color: #333; border-top-left-radius: 2px; }
        .other-msg-wrapper .message-info { text-align: left; }

        /* 시스템 메시지 */
        .system-msg { text-align: center; font-size: 12px; color: #aaa; margin: 10px 0; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>🐻 마이고미 채팅 (JWT 버전)</h2>

    <div class="input-group">
        <div class="row">
            <input type="number" id="roomId" placeholder="방 번호 (예: 1)" style="width: 80px;">
            <input type="text" id="token" placeholder="Bearer eyJhbGciOiJIUz..." style="flex: 1;">
        </div>
        <button onclick="connect()" id="btnConnect">입장하기</button>
    </div>

    <div id="messages">
        <div class="system-msg">방 번호와 토큰을 입력하고 입장해주세요.</div>
    </div>

    <div style="display: flex; gap: 5px;">
        <input type="text" id="message" placeholder="메시지를 입력하세요" style="flex: 1;" onkeypress="if(event.keyCode==13) sendMessage()">
        <button onclick="sendMessage()">전송</button>
    </div>
</div>

<script>
    var stompClient = null;
    var myEmail = null;

    // JWT 디코딩 함수 (한글 깨짐 방지 & URL Safe)
    function parseJwt(token) {
        try {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        } catch (e) {
            console.error("토큰 디코딩 실패:", e);
            return null;
        }
    }

    function connect() {
        var roomId = document.getElementById('roomId').value;
        var rawToken = document.getElementById('token').value.trim();

        if (!roomId || !rawToken) {
            alert("방 번호와 JWT 토큰을 모두 입력해주세요!");
            return;
        }

        // 1. 토큰 포맷 정리 ("Bearer "가 있든 없든 처리)
        var tokenForHeader = rawToken;
        var tokenForDecoding = rawToken;

        if (rawToken.startsWith("Bearer ")) {
            tokenForDecoding = rawToken.substring(7); // "Bearer " 제거 후 디코딩용
        } else {
            tokenForHeader = "Bearer " + rawToken; // 헤더 전송용엔 "Bearer " 추가
        }

        // 2. 토큰에서 내 정보(이메일) 추출
        var decoded = parseJwt(tokenForDecoding);
        if (!decoded || !decoded.sub) {
            alert("토큰이 올바르지 않습니다. (디코딩 실패)");
            return;
        }
        myEmail = decoded.sub;
        console.log("내 이메일 확인:", myEmail);

        // 3. 웹소켓 연결
        var socket = new SockJS('http://localhost:8080/ws-stomp');
        stompClient = Stomp.over(socket);

        // 연결 헤더에 Authorization 추가
        var headers = { 'Authorization': tokenForHeader };

        stompClient.connect(headers, function (frame) {
            console.log('Connected: ' + frame);

            var msgArea = document.getElementById('messages');
            msgArea.innerHTML = ''; // 기존 메시지 청소
            msgArea.innerHTML += '<div class="system-msg">🚀 ' + roomId + '번 방에 입장했습니다.</div>';

            // 버튼 비활성화 (중복 연결 방지)
            document.getElementById('btnConnect').innerText = "연결됨";
            document.getElementById('btnConnect').disabled = true;

            // 4. 구독 (Subscribe)
            stompClient.subscribe('/sub/chat/room/' + roomId, function (messageOutput) {
                showMessage(JSON.parse(messageOutput.body));
            });

        }, function(error) {
            console.log(error);
            alert("연결 실패 ㅠㅠ\n1. 서버가 켜져 있나요?\n2. 토큰이 만료되지 않았나요?\n3. 이 방(room_id)의 참여자가 맞나요?");
        });
    }

    function sendMessage() {
        var roomId = document.getElementById('roomId').value;
        var messageInput = document.getElementById('message');
        var message = messageInput.value;

        if (!stompClient) {
            alert("먼저 입장하기 버튼을 눌러주세요!");
            return;
        }
        if (!message) return;

        // 전송 (sender 정보 없이 보냄 -> 서버가 토큰으로 확인)
        stompClient.send("/pub/chat/message", {}, JSON.stringify({
            'roomId': roomId,
            'message': message
        }));

        messageInput.value = ''; // 입력창 비우기
    }

    function showMessage(msg) {
        var messageArea = document.getElementById('messages');
        var wrapper = document.createElement('div');

        var content = document.createElement('div');
        content.className = 'message-content';
        content.innerText = msg.message;

        var info = document.createElement('div');
        info.className = 'message-info';

        // ★ 내 이메일 vs 보낸사람 이메일 비교 ★
        if (msg.senderEmail === myEmail) {
            wrapper.className = 'message-wrapper my-msg-wrapper';
            info.innerText = msg.sendTime;
        } else {
            wrapper.className = 'message-wrapper other-msg-wrapper';
            // 상대방은 닉네임 + 시간 표시
            info.innerText = (msg.senderNickname || '알수없음') + " · " + msg.sendTime;
        }

        wrapper.appendChild(content);
        wrapper.appendChild(info);
        messageArea.appendChild(wrapper);

        // 스크롤 맨 아래로
        messageArea.scrollTop = messageArea.scrollHeight;
    }
</script>
</body>
</html>
