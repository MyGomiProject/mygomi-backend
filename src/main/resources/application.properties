# ==========================================
# 1. Application Setup
# ==========================================
spring.application.name=backend

# Force UTF-8 response encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ==========================================
# 2. Database (PostgreSQL)
# ==========================================
# Database connection (from environment variables)
spring.datasource.url=jdbc:postgresql://${DB_URL}/mygomi_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 3. JPA & Hibernate
# ==========================================
# Use validate because schema is managed by Flyway
spring.jpa.hibernate.ddl-auto=validate

# SQL logging
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable Open Session In View for API layer
spring.jpa.open-in-view=false

# ==========================================
# 4. Flyway (DB Migration)
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ==========================================
# 5. Swagger UI (SpringDoc)
# ==========================================
# UI URL: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# JWT
jwt.secret=vmfhalswkwlswjdfksuseksaklfjsfkdsjkaljfkljkljdkljfklfjksafsafsafsazxcv
jwt.expiration=86400000

# ==========================================
# Google Maps API Key
# ==========================================
# If GOOGLE_MAPS_API_KEY is not set, fallback to dummy-key
google.maps.api-key=${GOOGLE_MAPS_API_KEY:dummy-key}

# ==========================================
# Image Upload Size
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
